name: Docker Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 🧹 Checkout code
        uses: actions/checkout@v4

      - name: 🐳 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🏷️ Extract tag name
        id: extract_tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: 🔧 Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/tinyurl-server:${{ steps.extract_tag.outputs.tag_name }} \
                       -t ${{ secrets.DOCKER_USERNAME }}/tinyurl-server:latest \
                       tinyurl-server

      - name: 📤 Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/tinyurl-server:${{ steps.extract_tag.outputs.tag_name }}
          docker push ${{ secrets.DOCKER_USERNAME }}/tinyurl-server:latest
